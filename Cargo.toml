[package]
name = "kitchen-sink-demo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
topcoat = { git = "https://github.com/petehunt/topcoat.git", rev = "7aeb240ba3e269df738129597cc03cc804c74583", features = ["htmx", "tailwind", "vercel"] }

[build-dependencies]
topcoat = { git = "https://github.com/petehunt/topcoat.git", rev = "7aeb240ba3e269df738129597cc03cc804c74583", default-features = false, features = ["tailwind"] }

[[bin]]
name = "kitchen-sink-demo"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
