[package]
name = "kitchen-sink-demo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
topcoat = { git = "https://github.com/petehunt/topcoat.git", rev = "0fbf37b35a2c43e6be28f3efc12295c981a22a2d", features = ["htmx", "shell-view", "tailwind", "vercel"] }

[build-dependencies]
topcoat = { git = "https://github.com/petehunt/topcoat.git", rev = "0fbf37b35a2c43e6be28f3efc12295c981a22a2d", default-features = false, features = ["tailwind"] }

[[bin]]
name = "kitchen-sink-demo"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
